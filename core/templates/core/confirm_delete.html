{% extends "core/base.html" %}

{% block title %}{{ title }} | StratosERP{% endblock %}

{% block content %}
<section class="page-section">

    <div class="page-heading">
        <div><h2>{{ title }}</h2></div>
    </div>

    <form method="post" class="form-card">
        {% csrf_token %}
        <p>You are about to delete <strong>{{ object }}</strong>. This can't be undone.</p>

        <div class="form-actions">
            <button type="submit" class="primary-button danger">Delete permanently</button>
            <a href="{{ back_url }}" class="outline-button">Keep it</a>
        </div>
    </form>

</section>
{% endblock %}
